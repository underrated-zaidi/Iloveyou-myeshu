      constructor() {

        this.analyser = null;
        this.timer = null;
        this.notes = [261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 523.25, 659.25];
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.25;
        
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 64;

        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
      }

      playNote() {
        if (!this.ctx || !this.isPlaying) return;
        const freq = this.notes[Math.floor(Math.random() * this.notes.length)];
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500 + Math.random() * 400, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.1, this.ctx.currentTime + 1.0);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 4.0);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 4.2);
      }

      toggle() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        if (this.isPlaying) {
          this.isPlaying = false;
          if (this.timer) clearInterval(this.timer);
        } else {
          this.isPlaying = true;
          this.playNote();
          this.timer = setInterval(() => {
            if (Math.random() > 0.2) {
              this.playNote();
            }
          }, 1600);
        }
        return this.isPlaying;
      }

        }
      }

        if (this.analyser) {
          this.analyser.getByteFrequencyData(array);
        }
      }
    }
